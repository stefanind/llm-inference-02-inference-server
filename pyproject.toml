[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-server"
version = "0.1.0"
description = "A simple inference server"
requires-python = ">=3.11"
dependencies = [
    "torch==2.9.1",
    "transformers==5.10.2",
    "accelerate",
    "fastapi",
    "uvicorn",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]